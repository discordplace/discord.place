name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Staging
    env:
      BUILD_WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
      DEPLOY_PATH: /root/apps/discord.place-staging
      ECOSYSTEM_FILE: ecosystem.staging.config.cjs
      SITE_HOST: staging.discord.place
    steps:
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployable commit
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "::error::Commit $SHA is not reachable from main. Merge it first, then deploy."
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm --dir client install --frozen-lockfile --reporter=silent

      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: client/.next/cache
          key: next-staging-${{ runner.os }}-${{ hashFiles('client/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-staging-${{ runner.os }}-${{ hashFiles('client/pnpm-lock.yaml') }}-

      - name: Build client
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET || 'build-only' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}
          NEXT_PUBLIC_CF_SITE_KEY: ${{ vars.NEXT_PUBLIC_CF_SITE_KEY }}
          NEXT_PUBLIC_AUTH_COOKIE_NAME: ${{ vars.NEXT_PUBLIC_AUTH_COOKIE_NAME }}
          NEXT_PUBLIC_PROFILE_DEFAULT_HOST: ${{ vars.NEXT_PUBLIC_PROFILE_DEFAULT_HOST }}
          INTERNAL_API_URL: ${{ vars.INTERNAL_API_URL }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --dir client build

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:discordplace-ci
          use-cache: true
          args: --accept-dns=false

      - name: Stream build to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          tar -cf - --exclude='.next/cache' --exclude='.next/dev' -C client .next \
            | zstd -3 -T0 -q \
            | ssh -p "$SSH_PORT" -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
              'set -e; rm -rf /tmp/next.new; mkdir -p /tmp/next.new; zstd -d -q | tar -xf - --strip-components=1 -C /tmp/next.new'

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -p "$SSH_PORT" -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ECOSYSTEM_FILE='$ECOSYSTEM_FILE' SITE_HOST='$SITE_HOST' SHA='$SHA' bash -s" <<'EOF'
          set -euo pipefail

          exec 3>&1
          DEPLOY_LOG="$(mktemp)"
          exec >>"$DEPLOY_LOG" 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then { echo "Deploy failed with exit code $rc"; tail -n 40 "$DEPLOY_LOG"; } >&3; fi; rm -f "$DEPLOY_LOG"' EXIT

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          cd "$DEPLOY_PATH"
          ECOSYSTEM_PATH="$DEPLOY_PATH/$ECOSYSTEM_FILE"

          echo "Deploying commit $SHA" >&3

          git fetch --all --tags --force --quiet
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            git fetch origin "$SHA" --quiet
          fi
          git -c advice.detachedHead=false checkout --force --quiet "$SHA"

          pnpm --dir client install --frozen-lockfile --reporter=silent
          pnpm --dir server install --frozen-lockfile --reporter=silent

          rm -rf client/.next.new
          mv /tmp/next.new client/.next.new
          test -f client/.next.new/BUILD_ID

          rm -rf client/.next.prev
          if [ -d client/.next ]; then
            mv client/.next client/.next.prev
          fi
          mv client/.next.new client/.next

          pm2 startOrReload "$ECOSYSTEM_PATH" --update-env --silent
          pm2 save --silent

          curl -kfsS --max-time 30 --retry 15 --retry-delay 2 --resolve "$SITE_HOST:443:127.0.0.1" "https://$SITE_HOST/_api/health" >/dev/null
          curl -kfsS --max-time 30 --retry 15 --retry-delay 2 --resolve "$SITE_HOST:443:127.0.0.1" "https://$SITE_HOST/" >/dev/null

          echo "Deployed commit $SHA" >&3
          EOF

      - name: Notify Discord
        if: always() && env.BUILD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const url = process.env.WEBHOOK_URL;
            const payload = {
              embeds: [{
                title: "Staging deployment",
                description: `Commit ${process.env.COMMIT_SHA} — ${process.env.JOB_STATUS}`,
                url: process.env.RUN_URL,
                footer: { text: "discord.place staging" },
                color: 5793266
              }]
            };
            fetch(url, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            }).then(r => {
              if (!r.ok) throw new Error(`Discord webhook failed with ${r.status}`);
            }).catch(e => {
              console.log(`Notification skipped: ${e.message}`);
            });
          '
