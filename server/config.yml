# Default configuration shared by all deployments.
# Deployment-specific values belong in config.local.yml.

discordScopes:
  - 'identify'
  - 'email'
  - 'guilds'

botPresenceStatus: 'online'

trustProxy: true

discordWebhookRegex: ^https:\/\/discord(app)?\.com\/api\/webhooks\/\d+\/[\w-]+$

sitemapConfig:
  blogsChangeFrequency: 'monthly'
  useInternalNetworking: true

excludeCollectionsInBackup:
  - 'botdenies'
  - 'botvotetimeouts'
  - 'servervoteremindermetadas'
  - 'servervotereminders'
  - 'servervotetimeouts'
  - 'evaluateresults'
  - 'githubcaches'
  - 'plans'

serverListingRequirements:
  - id: 'enough_members'
    name: 'Minimum Member Count'
  - id: 'old_enough'
    name: 'Minimum Server Age'
  - id: 'has_icon'
    name: 'Server Icon'
  - id: '2fa_enabled'
    name: 'Two-Factor Authentication'
  - id: 'is_community'
    name: 'Community Server'
  - id: 'no_nsfw'
    name: 'No NSFW Content'

availableLocales:
  - name: 'English'
    code: 'en'
    flag: '🇺🇸'
    default: true
    countryCode: 'us'
  - name: 'Turkish'
    code: 'tr'
    flag: '🇹🇷'
    countryCode: 'tr'
